<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FocusVeil 焦点压暗效果示意</title>
  <desc id="desc">当前活动窗口保持清晰，其他窗口和桌面背景被压暗。</desc>
  <defs>
    <linearGradient id="desktopGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF5F1"/>
      <stop offset="0.54" stop-color="#F4F0E7"/>
      <stop offset="1" stop-color="#E8ECF8"/>
    </linearGradient>
    <linearGradient id="windowHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F6F7"/>
      <stop offset="1" stop-color="#E9ECEF"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-14%" width="124%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2F5D62"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FBFBF8"/>
  <text x="72" y="70" fill="#1E293B" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700">当前窗口保持清晰，周围环境自动压暗</text>
  <text x="72" y="112" fill="#475569" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">适合阅读、写作、开发和会议场景，视觉焦点会跟随系统当前活动窗口。</text>

  <g transform="translate(72 150)">
    <rect width="1136" height="500" rx="28" fill="#D8DEE9" filter="url(#softShadow)"/>
    <rect x="16" y="16" width="1104" height="468" rx="18" fill="url(#desktopGradient)"/>
    <rect x="16" y="16" width="1104" height="32" rx="18" fill="#F8FAFC"/>
    <rect x="16" y="38" width="1104" height="10" fill="#F8FAFC"/>
    <circle cx="44" cy="32" r="5" fill="#EF6461"/>
    <circle cx="62" cy="32" r="5" fill="#F7C948"/>
    <circle cx="80" cy="32" r="5" fill="#57B894"/>
    <text x="940" y="37" fill="#64748B" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">FocusVeil 已启用</text>

    <g opacity="0.45">
      <rect x="82" y="116" width="330" height="250" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="82" y="116" width="330" height="38" rx="16" fill="url(#windowHeader)"/>
      <rect x="112" y="184" width="238" height="14" rx="7" fill="#94A3B8"/>
      <rect x="112" y="218" width="190" height="14" rx="7" fill="#94A3B8"/>
      <rect x="112" y="252" width="250" height="14" rx="7" fill="#94A3B8"/>
      <rect x="112" y="302" width="120" height="34" rx="8" fill="#8CBDB9"/>
    </g>

    <g opacity="0.42">
      <rect x="746" y="104" width="284" height="300" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="746" y="104" width="284" height="38" rx="16" fill="url(#windowHeader)"/>
      <rect x="778" y="174" width="210" height="120" rx="12" fill="#D7C49E"/>
      <rect x="778" y="320" width="160" height="14" rx="7" fill="#94A3B8"/>
      <rect x="778" y="350" width="198" height="14" rx="7" fill="#94A3B8"/>
    </g>

    <rect x="16" y="48" width="1104" height="436" rx="0" fill="#0B1120" opacity="0.48"/>

    <g transform="translate(360 130)" filter="url(#softShadow)">
      <rect width="440" height="292" rx="18" fill="#FFFFFF" stroke="#B6C2CD"/>
      <rect width="440" height="42" rx="18" fill="url(#windowHeader)"/>
      <rect y="28" width="440" height="14" fill="#E9ECEF"/>
      <circle cx="24" cy="21" r="5" fill="#EF6461"/>
      <circle cx="42" cy="21" r="5" fill="#F7C948"/>
      <circle cx="60" cy="21" r="5" fill="#57B894"/>
      <rect x="36" y="80" width="180" height="18" rx="9" fill="#2F5D62"/>
      <rect x="36" y="120" width="344" height="13" rx="7" fill="#CBD5E1"/>
      <rect x="36" y="152" width="304" height="13" rx="7" fill="#CBD5E1"/>
      <rect x="36" y="184" width="328" height="13" rx="7" fill="#CBD5E1"/>
      <rect x="36" y="232" width="126" height="38" rx="10" fill="#B75D69"/>
      <rect x="184" y="232" width="126" height="38" rx="10" fill="#D6A75B"/>
    </g>

    <g font-family="Arial, 'PingFang SC', sans-serif">
      <path d="M796 115 C888 64 978 64 1044 106" fill="none" stroke="#2F5D62" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="842" y="62" width="238" height="42" rx="12" fill="#FFFFFF" stroke="#8CBDB9"/>
      <text x="862" y="89" fill="#1E293B" font-size="16">当前窗口保留原有亮度</text>

      <path d="M212 410 C190 360 210 320 236 292" fill="none" stroke="#B75D69" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="70" y="410" width="284" height="42" rx="12" fill="#FFFFFF" stroke="#D48A93"/>
      <text x="90" y="437" fill="#1E293B" font-size="16">背景窗口和桌面被统一压暗</text>

      <rect x="742" y="420" width="300" height="42" rx="12" fill="#FFFFFF" stroke="#D6A75B"/>
      <text x="762" y="447" fill="#1E293B" font-size="16">切换窗口后遮罩位置同步更新</text>
    </g>
  </g>
</svg>
